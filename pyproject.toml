[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jazzgpt"
version = "0.1.0"
description = "Laboratorio modulare per pianoforte jazz generativo"
requires-python = ">=3.11"
dependencies = ["mido>=1.3.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]
live = ["python-rtmidi>=1.5.8,<2"]
torch = ["torch>=2.5,<3"]

[project.scripts]
jazzgpt = "jazzgpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
